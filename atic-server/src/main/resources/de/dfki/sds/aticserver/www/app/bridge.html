<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">

        <link href="/app/css/bootstrap.min.css" rel="stylesheet" />
        <link href="/app/css/all.min.css" rel="stylesheet" />

        <script src="/app/js/bootstrap.bundle.min.js" ></script>
        <script src="/app/js/vue.global.prod.js" ></script>
        <script src="/app/js/axios.min.js"></script>

        <link rel="shortcut icon" href="/app/favicon.ico">

        <title>Bridge | Atic</title>
    </head>
    <body  style="margin-left: 60px; margin-right: 60px;"> <!-- class="container-fluid" -->

        <div id="app">
            <div class="row align-items-center">
                <div class="col d-flex align-items-center m-2">
                    <h3 class="mb-0 d-flex align-items-center me-2">
                        <img src="/app/img/atic-server.png" class="me-1" style="width: 32px; height: 32px">
                        RDF-JSON Bridge
                    </h3>
                </div>

                <div class="col-auto ms-auto me-2" v-if="user">
                    <span class="me-2" :title="user.username">
                        <i class="fa fa-user"></i> {{ user.firstname }} {{ user.lastname }}
                    </span>
                    <button class="btn btn-sm btn-danger" @click="postLogout()" title="Logout"><i class="fa fa-sign-out-alt"></i></button>
                </div>
            </div>

            <div class="row mb-2">
                <div class="col">

                    <ul class="nav nav-tabs">

                        <li
                            class="nav-item d-flex align-items-center"
                            v-for="(query, index) in queries"
                            :key="query.id"
                            >

                            <a
                                href="#"
                                class="nav-link"
                                :class="{active: activeQueryIndex === index}"
                                @click.prevent="activeQueryIndex = index"
                                >

                                <template v-if="editingTabIndex === index">
                                    <input
                                        type="text"
                                        class="form-control form-control-sm"
                                        v-model="query.name"
                                        @blur="editingTabIndex = null"
                                        @keyup.enter="$event.target.blur()"
                                        autofocus
                                        >
                                </template>

                                <template v-else>
                                    <span @dblclick="editingTabIndex = index">
                                        {{ query.name }}
                                    </span>
                                </template>

                                <button
                                    class="btn btn-sm btn-link text-danger ms-2"
                                    @click.stop="handleRemoveClick(index)"
                                    v-if="queries.length > 1"
                                    >
                                    <span v-if="deleteConfirmIndex === index">
                                        Confirm <i class="fa fa-times"></i>
                                    </span>
                                    <i v-else class="fa fa-times"></i>
                                </button>

                            </a>
                        </li>

                        <li class="nav-item">
                            <button
                                class="btn btn-sm btn-link mt-1"
                                @click="addQuery"
                                >
                                <i class="fa fa-plus"></i>
                            </button>
                        </li>

                    </ul>

                </div>
            </div>


            <div class="row mb-3">
                <div class="col">
                    <div class="d-flex align-items-center gap-2">
                        <select
                            class="form-select form-select-sm"
                            style="width: auto;"
                            v-model="activeMethod"
                            >
                            <option value="QUERY">QUERY</option>
                            <option value="POST">POST</option>
                            <option value="PUT">PUT</option>
                            <option value="PATCH">PATCH</option>
                            <option value="DELETE">DELETE</option>
                        </select>
                        
                        <button
                            class="btn btn-primary btn-sm"
                            @click="sendQuery"
                            >
                            <i class="fa fa-cog"></i> Send
                        </button>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label>Template</label>
                    <textarea
                        v-if="activeQuery"
                        class="form-control font-monospace"
                        style="font-size: 12px"
                        rows="10"
                        v-model="activeQuery.content"
                        ></textarea>
                </div>
                <div class="col" v-if="activeMethod !== 'QUERY'">
                    <label>Data</label>
                    <textarea
                        v-if="activeQuery"
                        class="form-control font-monospace"
                        style="font-size: 12px"
                        rows="10"
                        v-model="activeQuery.data"
                        ></textarea>
                </div>
            </div>


            <div class="row">
                <div class="col">

                    <ul class="nav nav-tabs mb-3">

                        <li class="nav-item">
                            <a
                                href="#"
                                class="nav-link"
                                :class="{active: activeResultTab === 'json'}"
                                @click.prevent="activeResultTab = 'json'"
                                >
                                JSON
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                href="#"
                                class="nav-link"
                                :class="{active: activeResultTab === 'rdf-patch'}"
                                @click.prevent="activeResultTab = 'rdf-patch'"
                                >
                                RDF-Patch
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                href="#"
                                class="nav-link"
                                :class="{active: activeResultTab === 'error'}"
                                @click.prevent="activeResultTab = 'error'"
                                >
                                Error
                            </a>
                        </li>

                    </ul>


                    <div v-if="activeResultTab === 'json'" style="font-size: 12px">
                        <div v-if="jsonData">
                            <pre
                                class="font-monospace mb-0"
                                style="font-size: 12px; white-space: pre-wrap;"
                                >{{ JSON.stringify(jsonData, null, 2) }}</pre>
                        </div>
                        <div v-else class="alert alert-secondary">
                            No data
                        </div>
                    </div>

                    <div v-if="activeResultTab === 'rdf-patch'" style="font-size: 12px">
                        <div v-if="rdfPatchResult">
                            <pre
                                class="font-monospace mb-0"
                                style="font-size: 12px; white-space: pre-wrap;"
                                >{{ rdfPatchResult }}</pre>
                        </div>
                        <div v-else class="alert alert-secondary">
                            No data
                        </div>
                    </div>


                    <div v-if="activeResultTab === 'error'">

                        <div
                            class="alert alert-danger"
                            v-if="error"
                            >
                            <strong>HTTP {{ error.status }}</strong><br>
                            <pre>{{ error.message }}</pre>
                        </div>

                    </div>

                </div>
            </div>
        </div>


        <script>
const {createApp} = Vue;

var app = createApp({

    data() {
        return {
            user: null,

            prefixes: `{{defaultPrefixes}}
`,
            prefixesExpanded: false,

            queries: [],

            activeQueryIndex: 0,

            editingTabIndex: null,

            activeResultTab: "json",

            rdfPatchResult: "",
            jsonData: null,

            error: null,

            nextQueryNumber: 1,

            deleteConfirmIndex: null,

            defaultTemplate: `{{defaultTemplate}}
`
        };
    },

    computed: {
        activeQuery() {
            return this.queries[this.activeQueryIndex] || null;
        },
        activeMethod: {

            get() {
                return this.activeQuery?.method || "QUERY";
            },

            set(value) {

                if (this.activeQuery) {
                    this.activeQuery.method = value;
                }
            }
        }
    },

    mounted() {
        this.getAuthMe();
        this.loadState();
    },

    watch: {
        queries: {
            handler() {
                this.saveState();
            },
            deep: true
        },

        activeQueryIndex: {
            handler() {
                this.saveState();
            }
        }

    },

    methods: {
        addQuery() {

            this.queries.push({
                id: Date.now(),
                name: `Bridge ${this.nextQueryNumber}`,
                content: this.defaultTemplate,
                method: "QUERY",
                data: ""
            });

            this.nextQueryNumber++;

            this.activeQueryIndex = this.queries.length - 1;
        },

        removeQuery(index) {

            this.queries.splice(index, 1);

            console.log(this.queries.length);

            if (this.queries.length === 0) {
                this.addQuery();
                return;
            }

            if (this.queries.length === 1) {
                this.activeQueryIndex = 0;
                return;
            }

            // if the removed tab was active,
            // focus the previous existing tab
            if (this.activeQueryIndex === index) {

                this.activeQueryIndex =
                        Math.min(index, this.queries.length - 1);

                return;
            }

            // if a tab before the active one was removed,
            // shift active index left
            if (this.activeQueryIndex > index) {
                this.activeQueryIndex--;
            }
        },

        handleRemoveClick(index) {

            // second click confirms delete
            if (this.deleteConfirmIndex === index) {
                this.removeQuery(index);
                this.deleteConfirmIndex = null;
                return;
            }

            // first click activates confirm state
            this.deleteConfirmIndex = index;

            // optional auto-reset safety (recommended)
            setTimeout(() => {
                if (this.deleteConfirmIndex === index) {
                    this.deleteConfirmIndex = null;
                }
            }, 3000);
        },

        normalizeEndpoint(endpoint) {

            if (
                    endpoint.startsWith("http://") ||
                    endpoint.startsWith("https://")
                    ) {
                return endpoint;
            }

            return `${window.location.origin}${endpoint}`;
        },
        async sendQuery() {
            this.error = null;
            this.rdfPatchResult = null;
            this.jsonData = null;

            try {
                const method = this.activeQuery.method;
                const template = JSON.parse(this.activeQuery.content);

                let response;

                if (method === "QUERY") {
                    response = await axios({
                        method: method,
                        url: "/bridge",
                        data: template,
                        headers: {
                            "Content-Type": "application/json"
                        }
                    });

                    this.jsonData = response.data;
                    this.activeResultTab = "json";
                } else {
                    const data = JSON.parse(this.activeQuery.data);

                    response = await axios({
                        method: method,
                        url: "/bridge",
                        data: {
                            template,
                            data
                        },
                        headers: {
                            "Content-Type": "application/json"
                        }
                    });

                    this.rdfPatchResult = response.data;
                    this.activeResultTab = "rdf-patch";
                }
            } catch (error) {
                let status = 0;
                let message = "Unknown error";

                if (error.response) {
                    status = error.response.status;
                    message = error.response.data || error.message;
                } else {
                    message = error.message;
                }

                this.error = {
                    status,
                    message
                };

                this.activeResultTab = "error";
            }
        },
        saveState() {

            localStorage.setItem(
                    "atic-bridge-client-state",
                    JSON.stringify({
                        queries: this.queries,
                        activeQueryIndex: this.activeQueryIndex,
                        nextQueryNumber: this.nextQueryNumber
                    })
                    );
        },

        loadState() {

            const raw = localStorage.getItem(
                    "atic-bridge-client-state"
                    );

            if (raw) {

                const state = JSON.parse(raw);

                this.prefixes = state.prefixes || this.defaultPrefixes;
                this.queries = state.queries || [];
                this.activeQueryIndex = state.activeQueryIndex || 0;
                this.nextQueryNumber = state.nextQueryNumber || 1;
            }

            if (this.queries.length === 0) {

                this.queries = [
                    {
                        id: Date.now(),
                        name: `Bridge ${this.nextQueryNumber}`,
                        content: this.defaultTemplate,
                        method: "QUERY",
                        data: ""
                    }
                ];

                this.nextQueryNumber++;
            }

            if (this.activeQueryIndex >= this.queries.length) {
                this.activeQueryIndex = this.queries.length - 1;
            }
        },

        copy(text) {
            navigator.clipboard.writeText(text);
        },

        getAuthMe() {
            axios.get('/auth/me').then(response => {
                this.user = response.data;
            }).catch(error => {
                if (error.response && error.response.status === 401) {
                    window.location.href = '/app/unauthorized.html';
                }
            });
        },

        postLogout() {
            axios.post('/auth/logout').then(response => {
                window.location.href = response.data.redirect;
            });
        }
    }

}).mount("#app");
        </script>

    </body>
</html>
