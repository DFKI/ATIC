<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">

        <link href="/app/css/bootstrap.min.css" rel="stylesheet" />
        <link href="/app/css/all.min.css" rel="stylesheet" />

        <script src="/app/js/bootstrap.bundle.min.js" ></script>
        <script src="/app/js/vue.global.prod.js" ></script>
        <script src="/app/js/axios.min.js"></script>

        <link rel="shortcut icon" href="/app/favicon.ico">

        <title>Invex</title>
    </head>
    <body  style="margin-left: 60px; margin-right: 60px;">

        <div id="app">
            <div class="row align-items-center">
                <div class="col d-flex align-items-center m-2">
                    <h3 class="mb-0 d-flex align-items-center me-2">
                        <img src="/app/img/atic-server.png"
                             class="me-1"
                             style="width: 32px; height: 32px">
                        Invex
                    </h3>

                    <span class="ms-2" :title="healthMessage">
                        <i class="fa fa-circle"
                           :class="healthAvailable === true
                           ? 'text-success'
                           : healthAvailable === false
                           ? 'text-danger'
                           : 'text-secondary'">
                        </i>
                        <small class="ms-1">{{ healthMessage }}</small>
                    </span>
                </div>

                <div class="col-auto ms-auto d-flex align-items-center gap-2">
                    <button class="btn btn-sm btn-outline-primary"
                            @click="postInvexRebuild()"
                            :disabled="rebuilding">
                        <span v-if="rebuilding"
                              class="spinner-border spinner-border-sm me-1"
                              role="status"></span>
                        <i v-else class="fa fa-sync-alt me-1"></i>
                        Rebuild index
                    </button>

                    <small v-if="rebuildMessage"
                           :class="rebuildSuccess === false
                           ? 'text-danger'
                           : rebuildSuccess === true
                           ? 'text-success'
                           : 'text-muted'">
                        {{ rebuildMessage }}
                    </small>

                    <template v-if="user">
                        <span class="ms-2"
                              :title="user.username">
                            <i class="fa fa-user"></i>
                            {{ user.firstname }} {{ user.lastname }}
                        </span>

                        <button class="btn btn-sm btn-danger"
                                @click="postLogout()"
                                title="Logout">
                            <i class="fa fa-sign-out-alt"></i>
                        </button>
                    </template>
                </div>
            </div>

            <hr>

            <!-- Query form -->
            <div class="card mb-3">
                <div class="card-header">
                    <i class="fa fa-search me-1"></i>
                    Query Invex
                </div>

                <div class="card-body">
                    <form @submit.prevent="postQuery()">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label for="operation" class="form-label">
                                    Operation
                                </label>
                                <select id="operation"
                                        class="form-select"
                                        v-model="operation">
                                    <option value="initialize">Initialize</option>
                                    <option value="continue">Continue</option>
                                </select>
                            </div>

                            <div class="col-md-9">
                                <label for="searchString" class="form-label">
                                    Search string
                                </label>
                                <input id="searchString"
                                       type="text"
                                       class="form-control"
                                       v-model="searchString"
                                       @focus="operation = 'initialize'"
                                       @input="operation = 'initialize'"
                                       placeholder="Enter search string">
                            </div>



                            <template v-if="operation === 'initialize'">
                                <div class="col-12">
                                    <div class="d-flex align-items-center flex-wrap gap-3 border rounded px-2 py-2 bg-body-tertiary">
                                        <small class="text-muted">
                                            <i class="fa fa-sliders-h me-1"></i>
                                            Options
                                        </small>

                                        <div class="d-flex align-items-center gap-2">
                                            <label for="limit" class="form-label small mb-0">
                                                Limit
                                            </label>
                                            <input id="limit"
                                                   type="number"
                                                   class="form-control form-control-sm"
                                                   style="width: 85px"
                                                   v-model="limit"
                                                   min="1"
                                                   step="1"
                                                   placeholder="Default">
                                        </div>

                                        <div class="d-flex align-items-center gap-2">
                                            <label for="offset" class="form-label small mb-0">
                                                Offset
                                            </label>
                                            <input id="offset"
                                                   type="number"
                                                   class="form-control form-control-sm"
                                                   style="width: 85px"
                                                   v-model="offset"
                                                   min="0"
                                                   step="1"
                                                   placeholder="Default">
                                        </div>

                                        <div class="form-check form-switch mb-0">
                                            <input id="autoContinue"
                                                   type="checkbox"
                                                   class="form-check-input"
                                                   role="switch"
                                                   v-model="autoContinue">
                                            <label for="autoContinue"
                                                   class="form-check-label small">
                                                Auto-continue
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <template v-if="operation === 'continue'">
                                <div class="col-12">
                                    <div class="d-flex align-items-center flex-wrap gap-3 border rounded px-2 py-2 bg-body-tertiary">
                                        <small class="text-muted">
                                            <i class="fa fa-sliders-h me-1"></i>
                                            Options
                                        </small>

                                        <div class="d-flex align-items-center gap-2">
                                            <label for="queryProcessID" class="form-label small mb-0 text-nowrap">
                                                Query process ID
                                            </label>
                                            <input id="queryProcessID"
                                                   type="text"
                                                   class="form-control form-control-sm"
                                                   v-model="queryProcessID"
                                                   placeholder="Enter query process ID"
                                                   style="width: 38ch"
                                                   required>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <div class="col-12 d-flex align-items-center gap-2">
                                <button type="submit"
                                        class="btn btn-primary"
                                        :disabled="querying">
                                    <span v-if="querying"
                                          class="spinner-border spinner-border-sm me-1"
                                          role="status"></span>
                                    <i v-else class="fa fa-play me-1"></i>
                                    {{ operation === 'initialize'
                                ? 'Initialize query'
                                : 'Continue query' }}
                                </button>

                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        @click="back()"
                                        v-if="operation === 'continue'"
                                        :disabled="querying">
                                    Back
                                </button>

                                <!-- button type="button"
                                        class="btn btn-outline-secondary"
                                        @click="clearQuery()"
                                        :disabled="querying">
                                    Clear
                                </button -->

                                <small v-if="queryMessage"
                                       :class="querySuccess
                                       ? 'text-success'
                                       : 'text-danger'">
                                    {{ queryMessage }}
                                </small>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Query results -->
            <div v-if="queryResult !== null" class="card mb-3">
                <div class="card-header d-flex align-items-center">
                    <span>
                        <i class="fa fa-list me-1"></i>
                        Query results
                    </span>

                    <button class="btn btn-sm btn-outline-secondary ms-auto"
                            @click="showJson = !showJson">
                        <i :class="showJson
                           ? 'fa fa-table'
                           : 'fa fa-code'"
                           class="me-1"></i>
                        {{ showJson ? 'Show table' : 'Show JSON' }}
                    </button>
                </div>

                <div class="card-body">
                    <template v-if="showJson">
                        <pre class="bg-body-tertiary border rounded p-3 mb-0"
                             style="white-space: pre-wrap; overflow-wrap: anywhere;"><code>{{ JSON.stringify(queryResult, null, 2) }}</code></pre>
                    </template>

                    <template v-else>
                        <div class="mb-3" v-if="queryResult.rawResults">
                            <span class="me-3">
                                <strong>Success:</strong>
                                {{ queryResult.rawResults.success }}
                            </span>

                            <span class="me-3">
                                <strong>Accepted:</strong>
                                {{ queryResult.rawResults.queryAccepted }}
                            </span>

                            <span class="me-3" v-if="queryResult.rawResults.responseTime != null">
                                <strong>Response time:</strong>
                                {{ queryResult.rawResults.responseTime }} ms
                            </span>

                            <span v-if="queryResult.rawResults.queryProcessID">
                                <strong class="me-1">Process ID:</strong>
                                <code>{{ queryResult.rawResults.queryProcessID }}</code>
                            </span>

                            <div v-if="queryResult.rawResults.error"
                                 class="text-danger mt-2">
                                {{ queryResult.rawResults.error }}
                            </div>
                        </div>

                        <div v-if="foundNodes.length === 0"
                             class="text-muted">
                            No nodes found.
                        </div>

                        <div v-else class="table-responsive">
                            <table class="table table-sm table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th style="width: 70px">#</th>
                                        <th>Node</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="(node, index) in foundNodes"
                                        :key="index">
                                        <td>{{ index + 1 }}</td>
                                        <td>
                                            <code class="text-break"
                                                  style="white-space: pre-wrap;">{{ formatNode(node) }}</code>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <script>
const {createApp} = Vue;

createApp({
    data() {
        return {
            user: null,

            healthAvailable: null,
            healthMessage: 'Checking health...',

            rebuilding: false,
            rebuildMessage: '',
            rebuildSuccess: null,

            operation: 'initialize',
            searchString: '',
            queryProcessID: '',
            limit: 20,
            offset: '',

            querying: false,
            queryMessage: '',
            querySuccess: false,
            queryResult: null,
            showJson: false,

            autoContinue: true
        };
    },

    computed: {
        foundNodes() {
            const nodes = this.queryResult?.foundNodes;
            return Array.isArray(nodes) ? nodes : [];
        }
    },

    created() {
        this.getAuthMe();
        this.getInvexHealth();
    },

    methods: {
        getAuthMe() {
            axios.get('/auth/me')
                    .then(response => {
                        this.user = response.data;
                    })
                    .catch(error => {
                        if (error.response?.status === 401) {
                            window.location.href = '/app/unauthorized.html';
                        }
                    });
        },

        getInvexHealth() {
            axios.get('/invex/health')
                    .then(response => {
                        this.healthAvailable = response.data?.available === true;
                        this.healthMessage = this.healthAvailable ? 'available' : 'unavailable';
                    })
                    .catch(() => {
                        this.healthAvailable = false;
                        this.healthMessage = 'Health check failed';
                    });
        },

        postInvexRebuild() {
            if (this.rebuilding) {
                return;
            }

            this.rebuilding = true;
            this.rebuildMessage = 'Rebuilding...';
            this.rebuildSuccess = null;

            axios.post('/invex/rebuild')
                    .then(response => {
                        const data = response.data || {};

                        this.rebuildSuccess = data.status === 'success'
                                || data.status === 'completed';

                        this.rebuildMessage = data.message
                                || (this.rebuildSuccess
                                        ? 'Rebuild completed.'
                                        : 'Rebuild failed.');

                        this.getInvexHealth();
                    })
                    .catch(error => {
                        this.rebuildSuccess = false;
                        this.rebuildMessage =
                                error.response?.data?.message
                                || `Rebuild failed (HTTP ${
                                error.response?.status || 'network error'
                                }).`;
                    })
                    .finally(() => {
                        this.rebuilding = false;
                    });
        },

        postQuery() {
            if (this.querying) {
                return;
            }

            const body = {
                operation: this.operation
            };

            if (this.operation === 'initialize') {
                if (this.searchString.trim() !== '') {
                    body.searchString = this.searchString.trim();
                }

                if (this.limit !== '') {
                    const value = Number(this.limit);

                    if (!Number.isInteger(value) || value < 1) {
                        this.queryMessage =
                                'Limit must be a positive integer.';
                        this.querySuccess = false;
                        return;
                    }

                    body.limit = value;
                }

                if (this.offset !== '') {
                    const value = Number(this.offset);

                    if (!Number.isInteger(value) || value < 0) {
                        this.queryMessage =
                                'Offset must be a non-negative integer.';
                        this.querySuccess = false;
                        return;
                    }

                    body.offset = value;
                }
            } else if (this.operation === 'continue') {
                if (!this.queryProcessID.trim()) {
                    this.queryMessage = 'Query process ID is required.';
                    this.querySuccess = false;
                    return;
                }

                body.queryProcessID = this.queryProcessID.trim();
            } else {
                this.queryMessage = 'Unsupported operation.';
                this.querySuccess = false;
                return;
            }

            this.querying = true;
            this.queryMessage = '';
            this.queryResult = null;
            this.showJson = false;

            axios.request({
                method: 'QUERY',
                url: '/invex',
                data: body,
                headers: {
                    'Content-Type': 'application/json'
                }
            })
                    .then(response => {
                        this.queryResult = response.data;
                        this.querySuccess = response.data?.success === true;

                        this.queryMessage = this.querySuccess
                                ? 'Query completed successfully.'
                                : 'Query returned an unsuccessful result.';

                        const processID =
                                response.data?.queryProcessID
                                || response.data?.rawResults?.queryProcessID;

                        if (processID) {
                            this.queryProcessID = processID;
                        }

                        //auto continue
                        if (this.autoContinue && this.querySuccess && this.operation === 'initialize') {
                            this.querying = false;
                            this.operation = 'continue';
                            this.postQuery();
                        }
                    })
                    .catch(error => {
                        this.querySuccess = false;
                        this.queryMessage =
                                error.response?.data?.message
                                || `Query failed (HTTP ${
                                error.response?.status || 'network error'
                                }).`;

                        if (error.response?.data) {
                            this.queryResult = error.response.data;
                            this.showJson = true;
                        }
                    })
                    .finally(() => {
                        this.querying = false;
                    });
        },

        formatNode(node) {
            if (node == null) {
                return '';
            }

            if (typeof node === 'string') {
                return node;
            }

            return JSON.stringify(node, null, 2);
        },

        back() {
            this.operation = 'initialize';
        },

        clearQuery() {
            this.searchString = '';
            this.queryProcessID = '';
            this.limit = '';
            this.offset = '';
            this.queryMessage = '';
            this.queryResult = null;
            this.querySuccess = false;
            this.showJson = false;
        },

        postLogout() {
            axios.post('/auth/logout')
                    .then(response => {
                        window.location.href = response.data.redirect;
                    });
        }
    }
}).mount('#app');
        </script>

    </body>
</html>
